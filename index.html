<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>深空甦醒 - 互動式劇情遊戲</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #050505;
            color: #e0e0e0;
            overflow-x: hidden;
        }

        /* 掃描線效果 CRT Effect */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.1) 50%,
                rgba(0,0,0,0.1)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 50;
        }

        /* 終端機閃爍游標 */
        .typing-cursor::after {
            content: '▋';
            animation: blink 1s step-end infinite;
            color: #10b981;
            margin-left: 4px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* 按鈕懸停效果 */
        .choice-btn {
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .choice-btn:hover {
            transform: translateX(8px);
            background-color: rgba(16, 185, 129, 0.1);
            border-color: #10b981;
        }
        
        /* 淡入動畫 */
        .fade-in {
            animation: fadeIn 0.8s ease-in forwards;
            opacity: 0;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 場景圖示容器 */
        .scene-visual {
            background: radial-gradient(circle at center, #1a2e26 0%, #000000 70%);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.2);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <!-- CRT Overlay -->
    <div class="scanlines"></div>

    <!-- Main Container -->
    <div class="w-full max-w-2xl bg-gray-900 border border-gray-700 rounded-lg shadow-2xl overflow-hidden relative z-10">
        
        <!-- Header / HUD -->
        <div class="bg-black border-b border-gray-800 p-4 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="w-3 h-3 rounded-full bg-red-500 animate-pulse" id="status-light"></div>
                <span class="text-xs text-gray-400 tracking-widest uppercase">SYSTEM: <span id="system-status" class="text-red-500 font-bold">CRITICAL</span></span>
            </div>
            <div class="text-xs text-gray-500 font-mono" id="time-display">00:00:00</div>
        </div>

        <!-- Visual Area -->
        <div class="h-48 md:h-64 w-full scene-visual flex items-center justify-center border-b border-gray-800 relative">
            <div id="scene-icon" class="text-6xl md:text-8xl text-emerald-500 filter drop-shadow-[0_0_10px_rgba(16,185,129,0.5)] transition-all duration-500">
                <!-- Icon injected by JS -->
            </div>
            <!-- Overlay for damage effect -->
            <div id="damage-overlay" class="absolute inset-0 bg-red-500 opacity-0 pointer-events-none transition-opacity duration-300"></div>
        </div>

        <!-- Text Content Area -->
        <div class="p-6 md:p-8 min-h-[200px]">
            <h2 id="scene-title" class="text-2xl font-bold text-white mb-4 tracking-wide border-l-4 border-emerald-500 pl-4 fade-in">
                初始化...
            </h2>
            <p id="scene-text" class="text-gray-300 leading-relaxed text-lg mb-6 fade-in font-light">
                系統正在載入...
            </p>

            <!-- Inventory Display -->
            <div id="inventory-container" class="mb-6 p-3 bg-gray-950 rounded border border-gray-800 hidden fade-in">
                <span class="text-xs text-gray-500 uppercase block mb-2">物品欄</span>
                <div id="inventory-list" class="flex gap-2 flex-wrap text-sm text-emerald-400">
                    <!-- Items injected here -->
                </div>
            </div>
        </div>

        <!-- Choices Area -->
        <div class="bg-black p-4 md:p-6 border-t border-gray-800">
            <div id="choices-container" class="flex flex-col gap-3">
                <!-- Buttons injected by JS -->
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="mt-8 text-center text-gray-600 text-xs z-10">
        <p>互動式網頁遊戲範本 | HTML5 + JS</p>
    </footer>

    <script>
        // --- Game Icons (SVG Strings) ---
        const icons = {
            cryo: `<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2" ry="2"></rect><line x1="12" y1="18" x2="12" y2="18.01"></line><path d="M12 2v4"></path><path d="M12 10v4"></path></svg>`,
            corridor: `<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 22h20"></path><path d="M2 2v20"></path><path d="M22 2v20"></path><path d="M12 2v14"></path><path d="M8 10h8"></path></svg>`,
            lab: `<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2v7.31"></path><path d="M14 2v7.31"></path><path d="M8.5 2h7"></path><path d="M14 9.3a6.5 6.5 0 1 1-4 0"></path><path d="M5.52 16h12.96"></path></svg>`,
            bridge: `<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>`,
            dead: `<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>`,
            escape: `<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><polyline points="13 2 13 9 20 9"></polyline></svg>`,
            keycard: `<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2" ry="2"></rect><line x1="7" y1="15" x2="7.01" y2="15"></line><line x1="11" y1="15" x2="13" y2="15"></line></svg>`
        };

        // --- Game Logic ---
        
        let gameState = {
            inventory: [],
            scene: 'start'
        };

        const scenes = {
            'start': {
                title: '冷凍艙室',
                icon: icons.cryo,
                text: '警報聲在耳邊迴盪。你從長久的冷凍睡眠中驚醒，艙門緩緩打開，冰冷的霧氣散去。你的頭很痛，且不記得為什麼會在這裡。房間裡閃爍著紅色的緊急燈光。',
                choices: [
                    { text: '檢查身旁的終端機', target: 'check_terminal' },
                    { text: '走出艙室進入走廊', target: 'corridor' }
                ]
            },
            'check_terminal': {
                title: '個人終端機',
                icon: icons.cryo,
                text: '螢幕佈滿了裂痕，但還能勉強閱讀：「警告：船體受損。生命維持系統剩餘 15%。全體船員請立即前往救生艙。」看來情況很不妙。',
                choices: [
                    { text: '離開房間', target: 'corridor' }
                ]
            },
            'corridor': {
                title: '黑暗走廊',
                icon: icons.corridor,
                text: '走廊上漆黑一片，只有地板上的引導燈微弱地亮著。空氣中瀰漫著焦味。左邊通往【實驗室】，右邊是巨大的【艦橋】大門，盡頭則是【逃生艙】區域。',
                choices: [
                    { text: '前往實驗室', target: 'lab' },
                    { text: '前往艦橋', target: 'bridge_entry' },
                    { text: '直接跑向逃生艙', target: 'escape_pods_locked' }
                ]
            },
            'lab': {
                title: '生物實驗室',
                icon: icons.lab,
                text: '實驗室一片狼藉，試管碎了一地。在角落的一具穿著白大褂的遺體旁，你發現了一張發光的卡片。',
                onEnter: () => {
                    // This creates a temporary state check
                    return !gameState.inventory.includes('管理員門禁卡');
                },
                choices: [
                    { 
                        text: '撿起門禁卡並離開', 
                        target: 'corridor',
                        action: () => addItem('管理員門禁卡')
                    },
                    { 
                        text: '不拿東西，直接離開', 
                        target: 'corridor' 
                    }
                ]
            },
            // Fallback scene if already visited lab and took item
            'lab_empty': {
                title: '生物實驗室',
                icon: icons.lab,
                text: '這裡沒什麼有用的東西了。只剩下破碎的玻璃和令人不安的寂靜。',
                choices: [
                    { text: '回到走廊', target: 'corridor' }
                ]
            },
            'bridge_entry': {
                title: '艦橋大門',
                icon: icons.bridge,
                text: '巨大的金屬門緊閉著。旁邊有一個讀卡機，紅燈閃爍顯示「鎖定中」。',
                choices: [
                    { 
                        text: '刷門禁卡', 
                        target: 'bridge_inside',
                        condition: () => hasItem('管理員門禁卡')
                    },
                    { 
                        text: '用力踢門', 
                        target: 'kick_door_fail' 
                    },
                    { text: '返回走廊', target: 'corridor' }
                ]
            },
            'kick_door_fail': {
                title: '艦橋大門',
                icon: icons.bridge,
                text: '你用力踢了一腳，但加固的鈦合金門紋絲不動，你的腳反而痛得要命。警報聲似乎變得更大聲了。',
                damage: true,
                choices: [
                    { text: '返回', target: 'bridge_entry' }
                ]
            },
            'bridge_inside': {
                title: '艦橋',
                icon: icons.bridge,
                text: '門「嘶」的一聲打開了。艦橋的視野壯觀但也令人恐懼——窗外是一顆巨大的黑洞，正在吞噬周圍的光線。主控台顯示逃生艙的發射程序被鎖定了，需要手動解鎖。',
                choices: [
                    { 
                        text: '解除逃生艙鎖定程序', 
                        target: 'unlock_success',
                        action: () => addItem('解鎖代碼')
                    },
                    { text: '嘗試修復引擎', target: 'engine_fail' }
                ]
            },
            'engine_fail': {
                title: '災難',
                icon: icons.dead,
                status: 'TERMINATED',
                text: '你試圖重啟引擎，但沒注意到燃料管線已經破裂。一個火花引爆了剩餘的燃料... 你的旅程到此結束。',
                choices: [
                    { text: '重新開始', target: 'start', action: resetGame }
                ]
            },
            'unlock_success': {
                title: '系統解鎖',
                icon: icons.keycard,
                text: '螢幕顯示：「授權通過。逃生艙已準備就緒。」你是時候離開這艘幽靈船了。',
                choices: [
                    { text: '跑回走廊', target: 'corridor_final' }
                ]
            },
            'corridor_final': {
                title: '走廊',
                icon: icons.corridor,
                text: '船身開始劇烈震動，黑洞的引力正在撕裂船體！你必須趕快前往逃生艙！',
                choices: [
                    { text: '衝向逃生艙', target: 'escape_pod_launch' }
                ]
            },
            'escape_pods_locked': {
                title: '逃生艙區',
                icon: icons.escape,
                text: '你來到逃生艙前，但按下發射按鈕沒有反應。螢幕顯示：「系統鎖定，請至艦橋解鎖。」',
                choices: [
                    { text: '該死！回到走廊', target: 'corridor' }
                ]
            },
            'escape_pod_launch': {
                title: '逃生成功',
                icon: icons.escape,
                status: 'SAFE',
                text: '你跳進最後一個逃生艙，按下發射鈕。逃生艙彈射出的瞬間，你透過窗戶看見母艦被黑洞徹底吞噬。你活下來了，雖然前途未卜，但至少還有希望。',
                choices: [
                    { text: '再次遊玩', target: 'start', action: resetGame }
                ]
            }
        };

        // --- Functions ---

        function addItem(item) {
            if (!gameState.inventory.includes(item)) {
                gameState.inventory.push(item);
                updateInventoryUI();
            }
        }

        function hasItem(item) {
            return gameState.inventory.includes(item);
        }

        function updateInventoryUI() {
            const container = document.getElementById('inventory-container');
            const list = document.getElementById('inventory-list');
            
            if (gameState.inventory.length > 0) {
                container.classList.remove('hidden');
                list.innerHTML = gameState.inventory.map(item => 
                    `<span class="bg-gray-900 border border-emerald-800 px-2 py-1 rounded flex items-center gap-1">
                        ${icons.keycard} ${item}
                    </span>`
                ).join('');
            } else {
                container.classList.add('hidden');
            }
        }

        function resetGame() {
            gameState.inventory = [];
            gameState.scene = 'start';
            updateInventoryUI();
            // Reset status
            document.getElementById('status-light').className = "w-3 h-3 rounded-full bg-red-500 animate-pulse";
            document.getElementById('system-status').innerText = "CRITICAL";
            document.getElementById('system-status').className = "text-red-500 font-bold";
        }

        function triggerDamageEffect() {
            const overlay = document.getElementById('damage-overlay');
            overlay.classList.remove('opacity-0');
            setTimeout(() => {
                overlay.classList.add('opacity-0');
            }, 300);
        }

        function renderScene(sceneId) {
            // Handle conditional scenes (e.g., visiting lab after taking item)
            if (sceneId === 'lab' && hasItem('管理員門禁卡')) {
                sceneId = 'lab_empty';
            }

            const scene = scenes[sceneId];
            
            // Execute onEnter action if exists
            if (scene.action) {
                scene.action();
            }

            // Update Text
            const titleEl = document.getElementById('scene-title');
            const textEl = document.getElementById('scene-text');
            const iconEl = document.getElementById('scene-icon');
            
            // Re-trigger animation
            titleEl.classList.remove('fade-in');
            textEl.classList.remove('fade-in');
            void titleEl.offsetWidth; // trigger reflow
            titleEl.classList.add('fade-in');
            textEl.classList.add('fade-in');

            titleEl.innerText = scene.title;
            textEl.innerText = scene.text;
            iconEl.innerHTML = scene.icon;

            // Damage Effect
            if (scene.damage) {
                triggerDamageEffect();
            }

            // Status Update (Endings)
            if (scene.status === 'SAFE') {
                document.getElementById('status-light').className = "w-3 h-3 rounded-full bg-emerald-500";
                document.getElementById('system-status').innerText = "STABLE";
                document.getElementById('system-status').className = "text-emerald-500 font-bold";
            } else if (scene.status === 'TERMINATED') {
                document.getElementById('status-light').className = "w-3 h-3 rounded-full bg-gray-500";
                document.getElementById('system-status').innerText = "OFFLINE";
                document.getElementById('system-status').className = "text-gray-500 font-bold";
            }

            // Generate Choices
            const choicesContainer = document.getElementById('choices-container');
            choicesContainer.innerHTML = '';

            scene.choices.forEach(choice => {
                // Check if choice has a condition (e.g., needs keycard)
                if (choice.condition && !choice.condition()) {
                    return; // Skip this choice if condition not met
                }

                const btn = document.createElement('button');
                btn.className = 'choice-btn w-full text-left bg-gray-900 border border-gray-700 text-gray-300 py-3 px-4 rounded hover:text-emerald-400 font-mono text-sm md:text-base group';
                
                // Add arrow icon on hover via HTML inside button
                btn.innerHTML = `<span class="mr-2 text-emerald-600 opacity-50 group-hover:opacity-100">></span>${choice.text}`;
                
                btn.onclick = () => {
                    renderScene(choice.target);
                };
                
                choicesContainer.appendChild(btn);
            });
        }

        // Clock
        setInterval(() => {
            const now = new Date();
            document.getElementById('time-display').innerText = now.toLocaleTimeString('en-US', {hour12: false});
        }, 1000);

        // Start Game
        window.onload = () => {
            renderScene('start');
        };

    </script>
</body>
</html>
